name: Android APK

on:
  push:
    branches: [ mobile ]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          python3 -m pip install pillow

      - name: Build Android APK (Path A - Universal Compatibility)
        run: |
          chmod +x tools/android/build_apk.sh
          REV="r${{ github.run_number }}"
          APK_FILE="pokemon-ds-wide-${REV}-arm64-v8a.apk"
          REV="${REV}" tools/android/build_apk.sh arm64-v8a "${APK_FILE}"
          echo "APK_NAME=${APK_FILE}" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
